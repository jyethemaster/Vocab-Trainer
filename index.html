function good(b){combo++;const x=Math.round(b*(1+Math.min(combo-1,5)*.2)),L=lvl();G.xp+=x;G.corr++;if(lvl()>L)toast("🎉 Niveau "+lvl()+"!");chk();save();hdr();return x}
function bad(){combo=0;hdr()}
function won(){G.wins++;chk();save();hdr()}

function tstop(){clearInterval(TM.id);TM.id=0}
function tstart(sec,cb){tstop();if(!sec)return;TM.tot=sec*1000;TM.end=Date.now()+TM.tot;TM.id=setInterval(()=>{const l=TM.end-Date.now(),b=document.getElementById("tb"),t=document.getElementById("tt");if(b){b.style.width=Math.max(0,l/TM.tot*100)+"%";b.style.background=l<TM.tot*.25?"var(--no)":""}if(t)t.textContent="⏱ "+Math.max(0,Math.ceil(l/1000))+"s";if(l<=0){tstop();cb()}},100)}

const chSel=()=>`<select id="ch">${["Alle hoofdstukken",1,2,3,4,5,6,"Mijn woorden"].map((o,i)=>`<option value="${i}" ${i==ch?"selected":""}>${i==7?o:i?"Hoofdstuk "+o:o}</option>`).join("")}</select>`;
const bindCh=()=>{const s=document.getElementById("ch");if(s)s.onchange=()=>{ch=+s.value;games[cur]()}};
const pool=(a,k)=>{const f=a.filter(x=>(!ch||x.c==ch)&&!isK(x)),g=a.filter(x=>!isK(x));return f.length?f:g.length?g:a};

/* GALGJE (5 mistakes) */
function hang(){
 const MAX=5,e=pick(pool(VOC)),w=e.w;let g=[],bd=0,xp=0;if(TS())tstart(TS()*4,()=>{bd=MAX;bad();rec("v:"+w,0);draw()});
 const parts=['<line x1="20" y1="140" x2="130" y2="140"/><line x1="40" y1="140" x2="40" y2="15"/><line x1="40" y1="15" x2="100" y2="15"/><line x1="100" y1="15" x2="100" y2="35"/>','<circle cx="100" cy="48" r="13"/>','<line x1="100" y1="61" x2="100" y2="100"/>','<line x1="100" y1="70" x2="80" y2="90"/><line x1="100" y1="70" x2="120" y2="90"/>','<line x1="100" y1="100" x2="85" y2="125"/>','<line x1="100" y1="100" x2="115" y2="125"/>'];
 function draw(){
  const wn=[...w].every(c=>g.includes(c)||!/[a-z]/.test(c)),lo=bd>=MAX,end=wn||lo;if(end)tstop();
  h(`<div class="sc"><span>❤️ ${"❤️".repeat(MAX-bd)}${"🖤".repeat(bd)}</span>${chSel()}</div>
  ${tbar()}<svg viewBox="0 0 150 150">${parts.slice(0,bd+1).join("")}</svg>
  <div class="word">${[...w].map(c=>g.includes(c)||lo||!/[a-z]/.test(c)?c:"_").join(" ")}</div>
  <div class="sc" style="justify-content:center">Vertaling: <b>&nbsp;${EN[w]||"?"}&nbsp;</b> · ${w.length} letters · ${e.c==7?"mijn lijst":"hoofdstuk "+e.c}</div>
  <div class="msg" style="color:var(--${wn?"ok":"no"})">${wn?"Goed zo! +"+xp+" XP 🎉":lo?"Het woord was: "+w:""}</div>
  <div class="keys">${"abcdefghijklmnopqrstuvwxyz".split("").map(c=>`<button class="b ${g.includes(c)?(w.includes(c)?"ok":"no"):""}" ${g.includes(c)||end?"disabled":""} data-c="${c}">${c}</button>`).join("")}</div>
  <div class="row"><button class="b" id="nx">Nieuw woord</button>${knBtn()}</div>`);bindCh();
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const c=b.dataset.c;g.push(c);
   if(!w.includes(c)){bad();bd++;if(bd>=MAX)rec("v:"+w,0)}else if([...w].every(x=>g.includes(x)||!/[a-z]/.test(x))){xp=good(10+(MAX-bd)*4);won();rec("v:"+w,1)}
   draw()});
  document.getElementById("nx").onclick=()=>{if(!end)bad();hang()};bindKn("v:"+w,hang);
 }
 draw();
}

/* MEMORY */
let mm="v",mlv=1;
function mem(){
 let pairs;
 if(mm=="v"){const seen=new Set();pairs=sh(pool(PR)).filter(x=>!seen.has(x.p)&&seen.add(x.p)).slice(0,[4,6,10][mlv]).map(x=>[x.t,x.p])}
 else{const u=new Set();pairs=sh(pool(VOC)).filter(x=>EN[x.w]&&!u.has(EN[x.w])&&u.add(EN[x.w])).slice(0,[4,6,10][mlv]).map(x=>[x.w,EN[x.w]])}
 const n=pairs.length;
 let cards=sh(pairs.flatMap((p,i)=>[{t:p[0],i},{t:p[1],i}])),open=[],done=new Set(),mv=0,lock=false,tout=false;if(TS())tstart(TS()*n,()=>{tout=true;bad();draw()});
 function draw(){
  const fin=done.size==n,st=mv<=n+3?3:mv<=n*2?2:1;if(fin||tout)tstop();
  h(`<div class="sc"><span>Zetten: ${mv} · Paren: ${done.size}/${n}</span><span><select id="md"><option value="v" ${mm=="v"?"selected":""}>Werkwoord ↔ voorzetsel</option><option value="e" ${mm=="e"?"selected":""}>Woord ↔ Engels</option></select></span></div>
  <div class="sc">${chSel()}<select id="lv">${["Makkelijk (4 paren)","Gemiddeld (6 paren)","Moeilijk (10 paren)"].map((o,i)=>`<option value="${i}" ${i==mlv?"selected":""}>${o}</option>`).join("")}</select></div>
  ${tbar()}<div class="grid">${cards.map((c,k)=>{const up=open.includes(k)||done.has(c.i);return `<button class="mc ${up?"up":""} ${done.has(c.i)?"done":""}" data-n="${k}">${up?c.t:"?"}</button>`}).join("")}</div>
  <div class="msg">${fin?"Klaar! "+"⭐".repeat(st)+" 🎉":tout?"⏰ Tijd is om!":"Zoek de passende paren."}</div>
  <div class="row"><button class="b" id="nx">Opnieuw</button></div>`);bindCh();
  document.getElementById("md").onchange=e=>{mm=e.target.value;mem()};document.getElementById("lv").onchange=e=>{mlv=+e.target.value;mem()};
  document.getElementById("nx").onclick=mem;
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{
   const k=+b.dataset.n;if(tout||lock||open.includes(k)||done.has(cards[k].i))return;
   open.push(k);draw();
   if(open.length==2){mv++;const[a,c]=open;
    if(cards[a].i==cards[c].i){done.add(cards[a].i);open=[];good(5);if(done.size==n){good(Math.round(st*10*[1,1.5,2][mlv]));won()}draw()}
    else{lock=true;bad();setTimeout(()=>{open=[];lock=false;draw()},900)}}
  });
 }
 draw();
}

/* VOORZETSELS (3 lives, endless run) */
let ps=0,lv=3;
function prep(fresh){
 if(fresh!==false){ps=0;lv=3}
 const all=[...new Set(PR.map(p=>p.p))],q=pick(pool(PR));let ans=null;if(TS())tstart(TS(),()=>{if(ans==null){ans="⏰";lv--;bad();rec(keyOf(q),0);draw()}});
 function draw(){
  if(lv<=0){tstop();if(ps>G.best){G.best=ps;save()}
   h(`<div class="big">💀</div><div class="msg">Game over! Score: ${ps} · Record: ${G.best}</div><div class="row"><button class="b" id="nx">Opnieuw spelen</button></div>`);
   document.getElementById("nx").onclick=()=>prep();return}
  h(`<div class="sc"><span>${"❤️".repeat(lv)}</span><span>Score: ${ps}</span>${chSel()}</div>
  ${tbar()}<div class="q ${ans==q.p?"pop":""}">${q.t} <u>${ans||"&nbsp;"}</u></div>
  <div class="opts">${all.map(o=>`<button class="b ${ans?(o==q.p?"ok":o==ans?"no":""):""}" ${ans?"disabled":""} data-o="${o}">${o}</button>`).join("")}</div>
  <div class="msg" style="color:var(--${ans==q.p?"ok":"no"})">${ans?(ans==q.p?"Juist! ✓":"Fout — "+q.t+" "+q.p):""}</div>
  <div class="row">${ans?'<button class="b" id="nx">Volgende →</button>':""}${knBtn()}</div>`);
  const s=document.getElementById("ch");if(s)s.onchange=()=>{ch=+s.value;prep()};
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{tstop();ans=b.dataset.o;rec(keyOf(q),ans==q.p);if(ans==q.p){ps++;good(8);if(ps%10==0)won()}else{lv--;bad()}draw()});
  const nx=document.getElementById("nx");if(nx)nx.onclick=()=>prep(false);bindKn(keyOf(q),()=>prep(false));
 }
 draw();
}

/* ZINNEN */
function scr(){
 const fx=pool(ALL),e=pick(fx),s=e.s,toks=s.split(" "),t0=Date.now();let pl,bt=[],res="",out=false;
 do pl=sh(toks.map(t=>({t})));while(pl.map(x=>x.t).join(" ")==s);if(TS())tstart(TS()*3,()=>{out=true;bad();if(e.w)rec("v:"+e.w,0);res="⏰ Tijd is om! "+s;draw()});
 function draw(){
  h(`<div class="sc"><span>Zet de zin in orde${e.w?` · <b>${e.w}</b> = ${EN[e.w]||""}`:""}</span>${chSel()}</div>
  ${tbar()}<div class="zone">${bt.map((x,n)=>`<button class="b t" data-b="${n}">${x.t}</button>`).join("")}</div>
  <div class="opts">${pl.map((x,n)=>`<button class="b t" data-p="${n}">${x.t}</button>`).join("")}</div>
  <div class="msg" style="color:var(--${res.startsWith("✓")?"ok":"no"})">${res}</div>
  <div class="row"><button class="b" id="ck">Controleer</button><button class="b" id="rs">Wissen</button><button class="b" id="nx">Nieuwe zin</button>${e.w?knBtn():""}</div>`);
  bindCh();app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{if(out)return;bt.push(pl.splice(+b.dataset.p,1)[0]);res="";draw()});
  app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{if(out)return;pl.push(bt.splice(+b.dataset.b,1)[0]);res="";draw()});
  document.getElementById("ck").onclick=()=>{if(out)return;
   if(bt.map(x=>x.t).join(" ")==s){tstop();if(e.w)rec("v:"+e.w,1);const sec=(Date.now()-t0)/1000,x=good(15+Math.max(0,Math.round(20-sec/2)));won();res="✓ Correct! +"+x+" XP"+(sec<20?" (snelheidsbonus ⚡)":"")}
   else{bad();if(e.w)rec("v:"+e.w,0);res="Nog niet goed, probeer het opnieuw."}draw()};
  document.getElementById("rs").onclick=()=>{pl=pl.concat(bt);bt=[];res="";draw()};
  document.getElementById("nx").onclick=scr;if(e.w)bindKn("v:"+e.w,scr);
 }
 draw();
}

 <textarea id="bak" style="margin-top:12px" placeholder="Back-up: Exporteer om te kopiëren, plak hier en klik Importeer op een ander apparaat"></textarea>
 <div class="row" style="margin-top:0"><button class="b" id="ex">Exporteer</button><button class="b" id="im">Importeer</button></div>`);
 const sel=document.getElementById("mt");sel.value=mt;sel.onchange=()=>{mt=sel.value;mmsg="";mine()};
 document.getElementById("add").onclick=()=>{const ok=addRow(L.map((_,n)=>document.getElementById("f"+n).value));mmsg=ok?"✓ Toegevoegd":"Vul minstens de eerste twee velden in.";persist();mine()};
 document.getElementById("bk").onclick=()=>{let n=0;document.getElementById("bulk").value.split("\n").forEach(l=>{n+=addRow(l.split("="))});mmsg="✓ "+n+" toegevoegd";persist();mine()};
 app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{MY[mt].splice(+b.dataset.d,1);persist();mine()});
 document.getElementById("ex").onclick=()=>{const t=JSON.stringify({...MY,pg:PG});document.getElementById("bak").value=t;try{navigator.clipboard.writeText(t)}catch(e){}};
 document.getElementById("im").onclick=()=>{try{const o=JSON.parse(document.getElementById("bak").value);["v","p","i"].forEach(k=>(Array.isArray(o[k])?o[k]:[]).forEach(x=>{if(x&&typeof x=="object"&&!MY[k].some(y=>JSON.stringify(y)==JSON.stringify(x)))MY[k].push(x)}));if(o.pg){Object.assign(PG.kn,o.pg.kn||{});for(const k in o.pg.st||{}){const a=PG.st[k],b=o.pg.st[k];if(!a||b.c+b.w>a.c+a.w)PG.st[k]=b}savePG()}mmsg="✓ Geïmporteerd"}catch(e){mmsg="Ongeldige back-up."}persist();mine()};
 hdr();
}
rebuild();hdr();go("Galgje");
